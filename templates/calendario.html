<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Habit Calendar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        * { -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col">

    <header class="sticky top-0 z-20 bg-gray-50/95 backdrop-blur-md border-b border-gray-200/50 px-4 pt-12 pb-2">
        <div class="flex justify-between items-center mb-4">
            <button onclick="prevMonth()" class="p-2 rounded-full hover:bg-gray-200 text-gray-500 transition">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
            </button>
            
            <h1 id="calendar-month-title" class="text-xl font-bold tracking-tight text-gray-900">Febrero 2026</h1>
            
            <button onclick="nextMonth()" class="p-2 rounded-full hover:bg-gray-200 text-gray-500 transition">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
            </button>
        </div>

        <div class="grid grid-cols-7 text-center mb-2">
            <div class="text-[10px] font-bold text-gray-400 uppercase">Lun</div>
            <div class="text-[10px] font-bold text-gray-400 uppercase">Mar</div>
            <div class="text-[10px] font-bold text-gray-400 uppercase">Mie</div>
            <div class="text-[10px] font-bold text-gray-400 uppercase">Jue</div>
            <div class="text-[10px] font-bold text-gray-400 uppercase">Vie</div>
            <div class="text-[10px] font-bold text-gray-400 uppercase">Sab</div>
            <div class="text-[10px] font-bold text-gray-400 uppercase">Dom</div>
        </div>
    </header>

    <main class="flex-1 px-2 pt-2 pb-32 overflow-y-auto no-scrollbar">
        
        <div id="calendar-grid" class="grid grid-cols-7 gap-y-4 gap-x-1 px-1 mt-4">

        </div>

    </main>

    <nav class="fixed bottom-0 w-full bg-white/80 backdrop-blur-xl border-t border-gray-200 pb-safe pt-2 px-6 z-50">
        <div class="flex justify-between items-center max-w-md mx-auto h-16">
            <a class="flex flex-col items-center gap-1 text-gray-400 w-16" href="/">
                <svg class="w-6 h-6" viewBox="0 0 20 20"><path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z" fill="currentColor"></path></svg>
                <span class="text-[10px] font-medium">Hoy</span>
            </a>
            <a class="flex flex-col items-center gap-1  text-blue-600 hover:text-gray-600 w-16" href="{{ url_for('main.calendario') }}">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" ></path></svg>
                <span class="text-[10px] font-medium">Mes</span>
            </a>

            <button class="flex flex-col items-center gap-1 text-gray-400 hover:text-gray-600 w-16">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 002 2h2a2 2 0 002-2z"></path></svg>
                <span class="text-[10px] font-medium">Stats</span>
            </button>
            <a href="{{ url_for('main.settings') }}" class="flex flex-col items-center gap-1 text-gray-400 hover:text-gray-600 w-16">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                <span class="text-[10px] font-medium">Ajustes</span>
            </a>
        </div>
    </nav>

    <div id="modal-dia-detalle" class="hidden fixed inset-0 z-50 flex items-end sm:items-center justify-center pointer-events-none">
    
        <div id="day-overlay" onclick="closeDayModal()" class="fixed inset-0 bg-black/60 backdrop-blur-sm opacity-0 transition-opacity duration-300 pointer-events-auto"></div>
    
        <div id="day-card" class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-8 relative z-10 transform translate-y-full transition-transform duration-300 shadow-2xl pointer-events-auto h-[75vh] sm:h-auto flex flex-col">
            
            <div class="flex justify-between items-center mb-6 flex-shrink-0">
                <div>
                    <h3 id="day-modal-title" class="text-2xl font-bold text-gray-900 tracking-tight">15 de Febrero</h3>
                    <p class="text-sm text-gray-400 font-medium">Hábitos completados</p>
                </div>
                <button onclick="closeDayModal()" class="p-2 bg-gray-100 rounded-full text-gray-500 hover:bg-gray-200 transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
    
            <div id="day-modal-content" class="overflow-y-auto no-scrollbar flex-1 space-y-3 pb-4">
                </div>
    
            <div class="pt-4 mt-2 border-t border-gray-100 flex-shrink-0">
                <button onclick="closeDayModal()" class="w-full bg-gray-100 text-gray-800 py-4 rounded-2xl font-bold text-lg hover:bg-gray-200 active:scale-95 transition-transform">
                    Cerrar
                </button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/config.js') }}"></script>
    <script src="{{ url_for('static', filename='js/storage.js') }}"></script>
    <script src="{{ url_for('static', filename='js/utils.js') }}"></script>
    <script src="{{ url_for('static', filename='js/render.js') }}"></script>
    <script src="{{ url_for('static', filename='js/habits.js') }}"></script>
    <script src="{{ url_for('static', filename='js/deleteMode.js') }}"></script>
    <script src="{{ url_for('static', filename='js/modal.js') }}"></script>
    <script src="{{ url_for('static', filename='js/calendar.js') }}"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
