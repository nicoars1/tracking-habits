<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Registro - ruti</title>
    <link rel="icon" href="../static/img/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        * { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col justify-center relative overflow-hidden px-4">

    <div class="absolute -top-20 -right-20 w-72 h-72 bg-gradient-to-br from-green-400 to-teal-500 rounded-full blur-3xl opacity-20 pointer-events-none"></div>
    <div class="absolute -bottom-20 -left-20 w-72 h-72 bg-gradient-to-tr from-blue-300 to-purple-400 rounded-full blur-3xl opacity-20 pointer-events-none"></div>

    <main class="w-full max-w-md mx-auto relative z-10 py-8">
        
        <div class="mb-8 relative">
            <a href="{{ url_for('auth.login') }}" class="absolute left-0 top-1 p-2 bg-white rounded-full text-gray-800 shadow-sm border border-gray-100 hover:bg-gray-50 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
            </a>
            <div class="text-center">
                <h1 class="text-3xl font-bold tracking-tight text-gray-900 mb-2">Crear Cuenta</h1>
                <p class="text-gray-500 font-medium">Empieza a construir tu mejor versión.</p>
            </div>
        </div>

        <div class="bg-white rounded-3xl p-8 shadow-xl shadow-gray-200/50 border border-gray-100">
            <form action="{{ url_for('auth.register') }}" method="POST" class="space-y-5">
                
                <div class="space-y-2">
                    <label class="text-xs font-bold text-gray-400 uppercase tracking-wider ml-1">Tu Nombre</label>
                    
                    {% with messages = get_flashed_messages() %}
                    {% if messages %}
                    <div>
                        {% for message in messages %}
                            <p> {{ message }} </p>
                        {% endfor %}
                    </div>
                    {% endif %}
                    {% endwith %}

                    <input name="user" type="text" placeholder="Ej: Nicolás" required
                           class="w-full p-4 bg-gray-50 rounded-2xl text-base font-bold text-gray-900 placeholder-gray-300 focus:bg-white focus:ring-2 focus:ring-black focus:outline-none transition-all">
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-bold text-gray-400 uppercase tracking-wider ml-1">Correo Electrónico</label>
                    <input name="email" type="email" placeholder="ejemplo@correo.com" required
                           class="w-full p-4 bg-gray-50 rounded-2xl text-base font-bold text-gray-900 placeholder-gray-300 focus:bg-white focus:ring-2 focus:ring-black focus:outline-none transition-all">
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-bold text-gray-400 uppercase tracking-wider ml-1">Contraseña</label>
                    <input name="password" type="password" placeholder="Mínimo 8 caracteres" required minlength="8"
                           class="w-full p-4 bg-gray-50 rounded-2xl text-base font-bold text-gray-900 placeholder-gray-300 focus:bg-white focus:ring-2 focus:ring-black focus:outline-none transition-all">
                </div>

                <button type="submit" class="w-full bg-black text-white py-4 rounded-2xl font-bold text-lg shadow-xl shadow-gray-300 active:scale-95 transition-transform hover:shadow-2xl mt-4">
                    Registrarse
                </button>
            </form>
        </div>

        <div class="mt-8 text-center">
            <p class="text-gray-500 font-medium">¿Ya tienes una cuenta? 
                <a href="{{ url_for('auth.login') }}" class="text-black font-bold hover:underline">Inicia sesión</a>
            </p>
        </div>

    </main>
</body>
</html>
